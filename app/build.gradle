plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    //
    id 'kotlin-android-extensions'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.android.myapplication"
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        //调试时或者有单独更新APK时候使用，发版本集成到系统，不需要签名,由Android.mk签名
        MT8163 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('./signature/platform_8163.jks')
            storePassword 'hcnrd123'
        }
        UIS8581 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('./signature/platform_8581.jks')
            storePassword 'hcnrd123'
        }
        AC8257 {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('./signature/platform_8257.jks')
            storePassword 'hcnrd123'
        }
        AC8227L {
            keyAlias 'hcnrd'
            keyPassword 'hcnrd123'
            storeFile file('./signature/platform_8227.jks')
            storePassword 'hcnrd123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.UIS8581
        }

        debug {
            signingConfig signingConfigs.UIS8581
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //Kotlin并没有将协程纳入标准库的API当中，而是以依赖库的形式提供的。所以如果我们想要使
    //用协程功能，需要先在app/build.gradle文件当中添加如下依赖库：
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.1")
    //第二个依赖库是在Android项目中才会用到的，本节我们编写的代码示例都是纯Kotlin程序，所
    //以其实用不到第二个依赖库。
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.1.1"

    // Retrofit核心库
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // Gson转换器，用于将JSON数据转换为Kotlin对象
    //gson-converter:2.9.0  蠢豆包
//    implementation 'com.squareup.retrofit2:gson-converter:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // 可选：如果需要处理RxJava相关的流（例如使用RxJava结合Retrofit）
    // implementation 'com.squareup.retrofit2:rxjava2-adapter:2.9.0'
    // 可选：如果需要进行网络请求的日志记录，可添加以下依赖
//    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:1.6.21"


}